name: Repository Audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/kaggle.txt
      - name: Install audit dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Repository audit
        run: make audit
      - name: Confirm no model weights are tracked
        run: PYTHONPATH=. python -m moss_t4x2.audit